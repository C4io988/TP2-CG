<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paraíso Pokémon</title>
    <link rel="icon" href="data:,">
    <link rel="preload" as="image" href="./assets/pokemon/textures/slowpoke.png">
    <link rel="preload" as="image" href="./assets/pokemon/textures/shellder.png">
    <link rel="preload" as="image" href="./assets/pokemon/textures/slowbro.png">
    <link rel="stylesheet" href="./styles.css?v=som-icone">
  </head>
  <body>
    <main>
      <canvas id="cena" tabindex="0" aria-label="Ilha em blocos sobre uma base hemisférica de pokébola"></canvas>
      <button id="som" type="button" aria-label="Ligar música" aria-pressed="false"><img src="./assets/icons/som-desligado.png" alt="" width="32" height="32"></button>
      <audio id="musica-fundo" src="./assets/audio/musica-fundo.m4a" loop muted preload="none"></audio>
      <p id="aviso-som" role="status"></p>
      <details class="comandos">
        <summary>Comandos</summary>
        <div class="modo-poses">
          <label for="modo-poses">Troca de poses</label>
          <select id="modo-poses">
            <option value="andar">Caminhar até a pose</option>
            <option value="instantaneo">Teletransportar para a pose</option>
          </select>
        </div>
        <dl>
          <div><dt><kbd>1</kbd></dt><dd>Câmera automática</dd></div>
          <div><dt><kbd>2</kbd></dt><dd>Câmera manual</dd></div>
          <div><dt><kbd>3</kbd></dt><dd>Alternar dia/noite</dd></div>
          <div><dt><kbd>4</kbd></dt><dd>Fechar/abrir Great Ball</dd></div>
          <div><dt><kbd>L</kbd></dt><dd>Ligar/desligar iluminação</dd></div>
          <div><dt><kbd>N</kbd></dt><dd>Mostrar/esconder neblina</dd></div>
          <div><dt><kbd>P</kbd></dt><dd>Próxima pose</dd></div>
          <div><dt><kbd>M</kbd></dt><dd>Pausar/retomar os passeios</dd></div>
          <div><dt><kbd>R</kbd></dt><dd>Reiniciar os pokemons</dd></div>
          <div><dt>Arrastar</dt><dd>Girar a câmera manual</dd></div>
          <div><dt>Scroll</dt><dd>Zoom nas duas câmeras</dd></div>
        </dl>
      </details>
      <p id="erro" role="alert" hidden></p>
    </main>
    <script type="module" src="./src/main.js?v=great-ball-arcos-2"></script>
  </body>
</html>
